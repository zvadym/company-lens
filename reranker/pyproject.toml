[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "company-lens-reranker"
version = "0.1.0"
description = "Internal ML reranker service for CompanyLens."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "sentence-transformers>=5.0,<6",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.2",
  "ruff>=0.6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["company_lens_reranker"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
